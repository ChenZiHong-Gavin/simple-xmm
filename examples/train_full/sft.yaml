model:
  # llm_name_or_path: "Qwen/Qwen2-7B-Instruct"
  llm_name_or_path: "/mnt/shared-storage-user/ai4agr-share/share/Qwen3-0.6B"
  trust_remote_code: true

  modal_configs:
    # protein:
    #   model_path: "facebook/esm2_t12_35M_UR50D"
    #   projector_type: "mlp"    # linear 或 mlp

    # image:
    #   model_path: "openai/clip-vit-base-patch32"
    #   projector_type: "mlp"

    # audio:
    #   model_path: "openai/whisper-base"
    #   projector_type: "linear"

method:
  stage: sft
  finetuning_type: full
  freeze:
    modals:
      - protein
      - dna
      - image
    projectors:
      - protein
      - dna
      - image
  deepspeed: examples/deepspeed/ds_z3_config.json

data:
  path: "data/alpaca_demo.json"
  template: "Alpaca"
  cutoff_len: 2048
  modal_cutoff_len:
    - protein: 512
    - dna: 512
    - image: 224
  max_samples: 1000
  preprocessing_num_workers: 16
  dataloader_num_workers: 4

output:
  output_dir: saves/qwen3-vl-4b/full/sft
  logging_steps: 10
  save_steps: 500
  save_only_model: false
  report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

train:
  # 基础参数
  num_train_epochs: 3.0
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8

  # 优化器
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"

  # 混合精度
  bf16: true    # A100/H100用bf16
  fp16: false   # V100用fp16

  # 分布式训练
  ddp_timeout: 180000000

  # 检查点
  resume_from_checkpoint: null

eval:
  val_size: 0.1
  per_device_eval_batch_size: 2
  eval_strategy: steps
  eval_steps: 500
