model:
  # llm_name_or_path: "Qwen/Qwen2-7B-Instruct"
  llm_name_or_path: "/mnt/shared-storage-user/ai4agr-share/share/Qwen3-0.6B"
  trust_remote_code: true

  modal_configs:
    image:
      model_type: "clip"
      model_path: "/mnt/shared-storage-user/ai4agr-share/share/clip-vit-base-patch32"
      trust_remote_code: true

output:
  output_dir: saves/Qwen3-0.6B/full/sft
  logging_steps: 10
  save_steps: 500
  save_only_model: false
  report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

method:
  stage: sft
  finetuning_type: full
  freeze:
    modals:
      - protein
      - dna
      - image
    projectors:
      - protein
      - dna
      - image
  deepspeed: examples/deepspeed/ds_z3_config.json

data:
  path: "data/text_image_to_text_demo.json"
  template: "Alpaca"
  cutoff_len: 2048
  max_samples: 1000
  preprocessing_num_workers: 16
  dataloader_num_workers: 4
  val_size: 0.1

train:
  # 基础参数
  num_train_epochs: 3.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1

  # 优化器
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"

  # 混合精度
  bf16: true
  fp16: false

  # 分布式训练
  ddp_timeout: 180000000

  # 检查点
  resume_from_checkpoint: null

  # 评估
  per_device_eval_batch_size: 1
  eval_strategy: epoch
  # eval_steps: 500
